name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ev_test_ci
          POSTGRES_USER: ev_ci
          POSTGRES_PASSWORD: ev_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ev_ci -d ev_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ev_ci:ev_ci@localhost:5432/ev_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: python -m pytest --cov=backend.app --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - run: python -m pip install pip-audit
      - run: pip-audit --skip-editable
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - shell: bash
        run: |
          export SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          cd ..
          docker compose up --build --wait -d
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits introduced by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            if git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
              BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
            else
              docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 dir /repo --redact=100
              exit
            fi
          fi
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact=100 "--log-opts=$BASE_SHA..HEAD"
